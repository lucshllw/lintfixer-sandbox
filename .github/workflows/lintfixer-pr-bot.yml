name: LintFixer PR Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  lintfixer-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run sandbox tests and PR Bot check
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npm test
          echo "LintFixer PR Bot checked PR #${PR_NUMBER}"
